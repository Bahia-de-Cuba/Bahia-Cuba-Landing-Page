<main>

<!-- ============================ HERO ============================ -->
<section id="inicio" class="hero relative min-h-[76svh] sm:min-h-[88svh] flex items-center justify-center pt-6 pb-28 sm:pb-44 overflow-hidden">

  <!-- Cielo de atardecer de Tuquillo, con los colores de la marca -->
  <div class="hero-cielo" aria-hidden="true">
    <span class="hero-sol"></span>
    <span class="hero-nube hero-nube--a"></span>
    <span class="hero-nube hero-nube--b"></span>
    <span class="hero-nube hero-nube--c"></span>
  </div>

  <!-- El hotel recortado: es el sujeto del hero, emerge del banco de niebla -->
  <img id="heroHotel" src="assets/img/hotel-recorte.webp"
       srcset="assets/img/hotel-recorte-sm.webp 622w, assets/img/hotel-recorte.webp 1130w"
       sizes="(min-width:1130px) 1130px, 112vw"
       width="1130" height="714" fetchpriority="high" decoding="async"
       alt="Fachada del Hotel Bahía de Cuba al atardecer, frente a Playa Tuquillo"
       class="hero-hotel">

  <!-- Velo: mantiene legible el texto sobre el cielo -->
  <div class="hero-veil" aria-hidden="true"></div>

  <!-- Banco de niebla marina: envuelve la base del hotel y enlaza con la sección siguiente -->
  <div id="heroNiebla" class="hero-niebla" aria-hidden="true"></div>

  <div id="heroContenido" class="hero-contenido relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-2.5 mb-6 sm:mb-8" data-reveal="up">
      <span class="px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-full text-[11px] sm:text-xs font-bold bg-white/95 text-night-900 shadow-sm backdrop-blur-md flex items-center gap-1.5 border border-white/60">
        <svg class="icon text-sunset-500" aria-hidden="true"><use href="#i-umbrella"/></svg>
        A 200 m de Playa Tuquillo
      </span>
      <span class="px-3.5 sm:px-4 py-1.5 sm:py-2 rounded-full text-[11px] sm:text-xs font-bold bg-eco-50 text-eco-600 shadow-sm backdrop-blur-md flex items-center gap-1.5 border border-eco-300/40">
        <svg class="icon text-eco-500" aria-hidden="true"><use href="#i-leaf"/></svg>
        100% solar y eólico
      </span>
    </div>

    <h1 class="font-heading text-[2rem] xs:text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold text-white max-w-5xl mx-auto leading-[1.1] tracking-tight drop-shadow-xl text-balance"
        data-reveal="up" style="--reveal-delay:90">
      Tu refugio de paz a orillas de <span class="text-gold-400 italic font-medium">Playa Tuquillo</span>
    </h1>

    <p class="mt-4 sm:mt-6 text-sm xs:text-base sm:text-lg md:text-xl text-white/90 max-w-2xl mx-auto leading-relaxed drop-shadow text-pretty"
       data-reveal="up" style="--reveal-delay:160">
      Hotel acogedor y sostenible en <strong class="font-semibold">Huarmey</strong>. Desconéctate frente al mar
      y disfruta nuestras noches en el <strong class="font-semibold">Rooftop Bar</strong>.
    </p>

    <div class="mt-7 sm:mt-9 flex flex-col xs:flex-row items-center justify-center gap-3 sm:gap-4"
         data-reveal="up" style="--reveal-delay:230">
      <a href="#habitaciones" class="w-full xs:w-auto px-7 sm:px-8 py-3.5 sm:py-4 rounded-2xl font-bold text-white bg-linear-to-r from-sunset-500 to-sunset-600 shadow-lg text-sm sm:text-base flex items-center justify-center gap-2 transition-all hover:from-sunset-600 hover:to-sunset-700 hover:-translate-y-1">
        <svg class="icon" aria-hidden="true"><use href="#i-bed"/></svg> Ver habitaciones
      </a>
      <a href="#reserva" class="w-full xs:w-auto px-7 sm:px-8 py-3.5 sm:py-4 rounded-2xl font-bold text-night-900 bg-linear-to-r from-gold-400 to-gold-500 shadow-lg text-sm sm:text-base flex items-center justify-center gap-2 transition-all hover:from-gold-300 hover:to-gold-400 hover:-translate-y-1">
        <svg class="icon" aria-hidden="true"><use href="#i-calculator"/></svg> Cotizar estadía
      </a>
    </div>
  </div>

  <a href="#confianza" aria-label="Bajar al contenido"
     class="hidden sm:flex absolute bottom-6 left-1/2 -translate-x-1/2 z-10 size-10 items-center justify-center rounded-full border border-night-900/15 bg-white/70 text-night-900 backdrop-blur-md animate-bounce hover:bg-white transition">
    <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
  </a>
</section>
