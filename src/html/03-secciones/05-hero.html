<!-- ============================ CARTEL PRINCIPAL ============================ -->
<main id="contenido">
<section class="cartel" id="inicio" aria-labelledby="titulo-hotel">
  <div class="cartel__cielo" aria-hidden="true"></div>

  <div class="cartel__rejilla">
    <div class="cartel__texto">
      <h1 class="cartel__titulo" id="titulo-hotel">
        <span class="linea linea--1" style="--fit:21">Hotel <img class="cartel__foto-linea" src="assets/img/fachada-sm.webp" width="660" height="730" alt="" decoding="async"></span>
        <span class="linea linea--2" style="--fit:47.3">Bahía</span>
        <span class="linea linea--3" style="--fit:35.5">de Cuba</span>
      </h1>

      <p class="cartel__lugar">
        Playa Tuquillo <span aria-hidden="true">·</span> Huarmey
        <span class="cartel__lugar-dato">200 m del mar · 4 h de Lima</span>
      </p>

      <p class="cartel__sol" data-sol-hoy>
        <svg class="icon" aria-hidden="true"><use href="#i-sunset"/></svg>
        <span data-sol="frase">Hoy el sol se pone sobre el Pacífico a las <strong>6:00 p. m.</strong></span>
      </p>

      <div class="cartel__acciones">
        <a href="#reservar" class="boton boton--rojo boton--grande">
          Reservar <span class="boton__precio">desde S/ <span data-precio-min>180</span></span>
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg>
        </a>
        <a href="#habitaciones" class="enlace-cartel">¿Qué habitación me sirve?</a>
        <a href="https://wa.me/51908925065?text=Hola%20Hotel%20Bah%C3%ADa%20de%20Cuba%2C%20deseo%20informaci%C3%B3n" target="_blank" rel="noopener" class="enlace-wa">
          <svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg> WhatsApp
        </a>
      </div>
    </div>

    <div class="cartel__escena">
      <div class="cartel__hora" role="group" aria-label="Ver el cartel de día, al atardecer o de noche">
        <p class="cartel__reloj"><span>Ahora en Tuquillo</span> <strong data-reloj>—</strong></p>
        <div class="selector-hora">
          <button type="button" data-ver-hora="dia" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span>Día</span></button>
          <button type="button" data-ver-hora="atardecer" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-sunset"/></svg><span>Atardecer</span></button>
          <button type="button" data-ver-hora="noche" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span>Noche</span></button>
        </div>
      </div>

      <svg class="sol-puntos" id="solCartel" viewBox="-300 -300 600 600" aria-hidden="true" focusable="false"></svg>

      <img src="assets/img/hotel-recorte.webp"
           srcset="assets/img/hotel-recorte-sm.webp 622w, assets/img/hotel-recorte.webp 1130w"
           sizes="(min-width:1024px) 46vw, 100vw"
           width="1130" height="714" fetchpriority="high" decoding="async"
           alt="Fachada del Hotel Bahía de Cuba con su mural del atardecer y el letrero de Varadero 319 Rooftop"
           class="cartel__hotel">
    </div>
  </div>
</section>
