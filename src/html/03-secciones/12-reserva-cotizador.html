<!-- ============================ RESERVA / COTIZADOR ============================ -->
<section id="reserva" class="py-16 sm:py-24 bg-linear-to-r from-sunset-700 via-sunset-600 to-sunset-500 text-white relative overflow-hidden">
  <div class="max-w-5xl mx-auto px-4 text-center relative z-10 mb-10 sm:mb-12" data-reveal="up">
    <span class="text-[10px] sm:text-[11px] uppercase font-bold tracking-widest text-gold-200">Reserva directa</span>
    <h2 class="font-heading text-[1.75rem] xs:text-3xl sm:text-4xl md:text-5xl font-bold mt-2 leading-tight">
      Cotiza y reserva directo
    </h2>
    <p class="mt-3 text-white/90 text-sm sm:text-base max-w-2xl mx-auto text-pretty">
      Sin comisiones de intermediarios. Calcula tu presupuesto y envíalo por WhatsApp en un clic.
    </p>
  </div>

  <div id="calculadora" class="max-w-4xl mx-4 sm:mx-auto bg-white rounded-3xl p-5 sm:p-8 shadow-2xl text-left relative z-10" data-reveal="zoom">
    <form id="formCotizacion" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end" novalidate>
      <div>
        <label for="cCheckin" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Check-in</label>
        <input type="date" id="cCheckin" name="checkin" required
               class="w-full px-3.5 py-2.5 bg-sand-50 border border-slate-200 rounded-xl font-medium text-slate-800">
      </div>
      <div>
        <label for="cCheckout" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Check-out</label>
        <input type="date" id="cCheckout" name="checkout" required
               class="w-full px-3.5 py-2.5 bg-sand-50 border border-slate-200 rounded-xl font-medium text-slate-800">
      </div>
      <div>
        <label for="cRoom" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Habitación</label>
        <select id="cRoom" name="habitacion" class="w-full px-3.5 py-2.5 bg-sand-50 border border-slate-200 rounded-xl font-medium text-slate-800">
          <option value="Individual"  data-precio="180">Individual (1 cama)</option>
          <option value="Matrimonial" data-precio="220" selected>Matrimonial</option>
          <option value="Doble"       data-precio="280">Doble (cama + camarote)</option>
          <option value="Familiar"    data-precio="350">Familiar</option>
        </select>
      </div>
      <div>
        <label for="cGuests" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Huéspedes</label>
        <select id="cGuests" name="huespedes" class="w-full px-3.5 py-2.5 bg-sand-50 border border-slate-200 rounded-xl font-medium text-slate-800">
          <option value="1">1 persona</option>
          <option value="2" selected>2 personas</option>
          <option value="3">3 personas</option>
          <option value="4">4 personas</option>
          <option value="5">5 personas</option>
          <option value="6">6 personas</option>
        </select>
      </div>

      <p id="calcAviso" role="status" hidden
         class="sm:col-span-2 lg:col-span-4 -mt-1 text-xs font-semibold text-sunset-600 bg-sunset-50 border border-sunset-200 rounded-xl px-4 py-2.5"></p>

      <div class="sm:col-span-2 lg:col-span-4 bg-sand-50 rounded-2xl p-4 border border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4 mt-1">
        <div class="text-center sm:text-left">
          <p class="text-xs text-slate-500 font-medium" id="calcDetalle">Tarifa estimada</p>
          <p class="text-2xl sm:text-3xl font-heading font-bold text-night-900">
            S/ <span id="calcTotal" class="text-sunset-600">220.00</span>
          </p>
        </div>
        <button type="submit"
                class="w-full sm:w-auto px-8 py-3.5 bg-eco-500 hover:bg-eco-600 text-white font-bold text-sm rounded-xl transition-all shadow-md flex items-center justify-center gap-2 hover:-translate-y-0.5">
          <svg class="icon text-lg" aria-hidden="true"><use href="#i-whatsapp"/></svg>
          Enviar a WhatsApp
        </button>
      </div>
      <p class="sm:col-span-2 lg:col-span-4 text-[11px] text-slate-400 text-center -mt-1">
        La tarifa es referencial. Confirmamos disponibilidad y precio final por WhatsApp.
      </p>
    </form>
  </div>
</section>
